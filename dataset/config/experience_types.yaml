# 8 类经历单元及其差异化追问策略
experience_types:
  education:
    label: "教育经历"
    focus: "专业知识掌握、核心课程理解、毕业设计或论文贡献、理论知识的实际应用"
    preferred_dimensions: [professional_depth, learning_ability, technical_implementation]
    preferred_question_types: [technical_deep_dive, clarification, reflection]
  internship:
    label: "实习经历"
    focus: "实际参与的工作内容、个人贡献与团队贡献、对工作流程的理解、实习期间的学习与成长"
    preferred_dimensions: [personal_contribution, learning_ability, teamwork, business_understanding]
    preferred_question_types: [contribution_verification, clarification, reflection]
  work_experience:
    label: "正式工作经历"
    focus: "岗位职责、实际业务贡献、工作成果真实性、工作流程与解决问题能力、跨部门协作"
    preferred_dimensions: [personal_contribution, achievement_verification, problem_solving, teamwork, leadership]
    preferred_question_types: [contribution_verification, result_verification, problem_investigation]
  project_experience:
    label: "项目经历"
    focus: "项目背景与目标、个人承担的具体任务、技术方案与实现过程、关键技术决策、难点与解决方法、成果与指标依据"
    preferred_dimensions: [technical_implementation, technical_decision, problem_solving, data_evidence, project_management]
    preferred_question_types: [technical_deep_dive, decision_analysis, data_verification, scenario_analysis]
  achievement:
    label: "工作成果或业绩"
    focus: "成果计算方法、数据来源、对比基准、个人贡献、成果可复现性、成果与业务价值之间的关系"
    preferred_dimensions: [achievement_verification, data_evidence, business_understanding, personal_contribution]
    preferred_question_types: [result_verification, data_verification, problem_investigation]
  skill_application:
    label: "专业技能的实际应用"
    focus: "技术原理、实际应用场景、实现细节、技术边界、替代方案、异常情况处理"
    preferred_dimensions: [professional_depth, technical_implementation, risk_awareness, technical_decision]
    preferred_question_types: [technical_deep_dive, scenario_analysis, risk_investigation]
  research:
    label: "学术研究或科研经历"
    focus: "研究问题、理论依据、实验设计、方法创新、数据与实验结果、研究局限性"
    preferred_dimensions: [professional_depth, innovation, data_evidence, reflection]
    preferred_question_types: [technical_deep_dive, decision_analysis, reflection]
  competition:
    label: "竞赛经历"
    focus: "竞赛目标、团队分工、个人贡献、方案设计、技术实现、成果和评价依据"
    preferred_dimensions: [personal_contribution, teamwork, innovation, technical_implementation]
    preferred_question_types: [contribution_verification, technical_deep_dive, result_verification]

# 追问优先级顺序（越靠前越优先被选为问题来源）
generation_priority: [project_experience, work_experience, internship, achievement, skill_application, research, competition, education]
