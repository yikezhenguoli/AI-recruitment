# 15 个统一追问维度（英文标签为标准数据标签，禁止新增）
dimensions:
  - key: "personal_contribution"
    label: "个人实际贡献"
  - key: "technical_implementation"
    label: "技术实现细节"
  - key: "achievement_verification"
    label: "成果真实性验证"
  - key: "data_evidence"
    label: "数据及指标依据"
  - key: "problem_solving"
    label: "问题解决能力"
  - key: "technical_decision"
    label: "技术决策能力"
  - key: "teamwork"
    label: "团队协作能力"
  - key: "leadership"
    label: "领导与管理能力"
  - key: "business_understanding"
    label: "业务理解能力"
  - key: "innovation"
    label: "创新能力"
  - key: "project_management"
    label: "项目管理能力"
  - key: "learning_ability"
    label: "学习能力"
  - key: "risk_awareness"
    label: "风险意识"
  - key: "reflection"
    label: "复盘与改进能力"
  - key: "professional_depth"
    label: "专业深度"

# 不同经历类型的主维度候选（生成时按岗位权重再加权）
default_dimension_pool:
  education: [professional_depth, learning_ability, technical_implementation, reflection]
  internship: [personal_contribution, learning_ability, teamwork, business_understanding, reflection]
  work_experience: [personal_contribution, achievement_verification, problem_solving, teamwork, leadership, business_understanding, project_management]
  project_experience: [technical_implementation, technical_decision, problem_solving, data_evidence, project_management, innovation, risk_awareness]
  achievement: [achievement_verification, data_evidence, business_understanding, personal_contribution, reflection]
  skill_application: [professional_depth, technical_implementation, risk_awareness, technical_decision, problem_solving]
  research: [professional_depth, innovation, data_evidence, reflection, technical_decision]
  competition: [personal_contribution, teamwork, innovation, technical_implementation, reflection]
