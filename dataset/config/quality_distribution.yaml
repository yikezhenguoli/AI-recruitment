# 工作年限与简历质量的精确配额（合计必须为 total_resumes）
career_levels:
  - key: "fresh"
    label: "应届毕业生"
    count: 1000
    min_years: 0
    max_years: 0
  - key: "junior"
    label: "1-3年"
    count: 1250
    min_years: 1
    max_years: 3
  - key: "mid"
    label: "3-5年"
    count: 1250
    min_years: 3
    max_years: 5
  - key: "senior"
    label: "5-10年"
    count: 1000
    min_years: 5
    max_years: 10
  - key: "expert"
    label: "10年以上"
    count: 500
    min_years: 10
    max_years: 18

resume_qualities:
  - key: "high"
    label: "优质简历"
    count: 1500
  - key: "normal"
    label: "普通简历"
    count: 2000
  - key: "vague"
    label: "信息模糊型"
    count: 1000
  - key: "contradictory"
    label: "存在矛盾或疑点型"
    count: 500

# 质量类型的文本策略权重（生成器读取）
quality_profiles:
  high:
    vague_sentence_prob: 0.0
    metric_prob: 0.95
    tech_detail_prob: 0.92
    personal_boundary_clarity: 0.95
    risk_injection: 0
  normal:
    vague_sentence_prob: 0.12
    metric_prob: 0.55
    tech_detail_prob: 0.60
    personal_boundary_clarity: 0.70
    risk_injection: 0
  vague:
    vague_sentence_prob: 0.75
    metric_prob: 0.08
    tech_detail_prob: 0.20
    personal_boundary_clarity: 0.20
    risk_injection: 0
  contradictory:
    vague_sentence_prob: 0.35
    metric_prob: 0.55
    tech_detail_prob: 0.55
    personal_boundary_clarity: 0.55
    risk_injection: 1
