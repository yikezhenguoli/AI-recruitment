# 0~100 质量评分规则。硬性门槛独立判定，不参与加权求和；任一不过即判不合格。
score_scale: [0, 100]

hard_gates:
  experience_link_valid: "问题必须关联存在且归属一致的 experience_id"
  reference_exact_match: "reference.original_text 必须是对应经历 original_content 的精确子串，且偏移量一致"
  no_generic_question: "问题必须包含可定位的原文引用，禁止泛泛提问"
  no_cross_experience_mix: "问题与追问链不得混合其他经历单元的内容"
  chain_experience_consistent: "追问链所有层级必须围绕同一个 experience_id"

resume_weights:
  information_completeness: 20
  timeline_consistency: 20
  position_match: 20
  authenticity_expression: 15
  experience_richness: 15
  language_naturalness: 10

experience_weights:
  description_clarity: 20
  responsibility_clarity: 20
  detail_richness: 20
  achievement_verifiability: 20
  probe_value: 20

question_weights:
  experience_link_accuracy: 25
  reference_accuracy: 20
  targeting: 15
  probe_depth: 12
  position_relevance: 10
  interview_practicality: 10
  independence: 8

deductions:
  question_without_exact_reference: 100
  generic_question: 40
  cross_experience_mix: 35
  duplicate_question: 25
  missing_reason: 20
  missing_expected_investigation: 15
  unnatural_placeholder: 30
  too_short_question: 10

chain_weights:
  single_experience: 25
  progression: 20
  purpose_clarity: 20
  trigger_condition: 15
  non_repetition: 10
  evidence_based: 10
