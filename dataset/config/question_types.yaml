# 10 种问题类型
question_types:
  - key: "clarification"
    label: "信息澄清"
    description: "针对简历中表述笼统、缺失关键信息的内容进行澄清"
  - key: "contribution_verification"
    label: "个人贡献核实"
    description: "区分个人工作与团队成果，确认本人实际承担的部分"
  - key: "technical_deep_dive"
    label: "技术细节深挖"
    description: "追问实现原理、关键参数、边界条件与异常处理"
  - key: "result_verification"
    label: "成果核实"
    description: "核实成果的取得过程、可复现性与业务价值"
  - key: "data_verification"
    label: "数据指标核实"
    description: "追问指标口径、数据来源、对比基准与测量方法"
  - key: "scenario_analysis"
    label: "场景分析"
    description: "将经历迁移到新场景，考察经验的可迁移性"
  - key: "decision_analysis"
    label: "决策分析"
    description: "追问方案选择依据、替代方案与权衡过程"
  - key: "problem_investigation"
    label: "问题排查"
    description: "追问故障或难点现象、定位路径与根因"
  - key: "risk_investigation"
    label: "风险核实"
    description: "核实时间线、职责与成果之间的疑点，注意不预设造假"
  - key: "reflection"
    label: "复盘反思"
    description: "追问事后复盘、改进措施与二次实践效果"

# 类型与主维度的常见搭配（生成器用于候选组合，不做强制全覆盖）
type_dimension_affinity:
  clarification: [personal_contribution, business_understanding, technical_implementation]
  contribution_verification: [personal_contribution, teamwork, leadership]
  technical_deep_dive: [technical_implementation, professional_depth, technical_decision]
  result_verification: [achievement_verification, business_understanding]
  data_verification: [data_evidence, achievement_verification]
  scenario_analysis: [risk_awareness, technical_decision, business_understanding]
  decision_analysis: [technical_decision, innovation, project_management]
  problem_investigation: [problem_solving, risk_awareness, professional_depth]
  risk_investigation: [achievement_verification, data_evidence, risk_awareness]
  reflection: [reflection, learning_ability, innovation]
