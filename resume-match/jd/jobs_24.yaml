# 简历-岗位匹配：24 类岗位描述（JD）
#
# 填写说明
# --------
# 1. `code` 必须与数据集目录名逐字一致（全大写 + 连字符），不要修改。
# 2. 除 ACCOUNTANT 外，其余条目按 ACCOUNTANT 的结构生成，内容按职业调整；
#    `source` 标为 "AI 生成，待人工核实"，请按实际需要修改或核实。
# 3. 列表一律用块式 `-`，不要用 `[]`；含英文冒号的字符串用双引号包起来。
# 4. 中英两栏保持对应；英文是喂给模型的正式文本，中文用于展示。
# 5. 建议补全方向：summary 1-2 句、responsibilities 3-5 条、
#    required_skills 4-8 条、experience_years 一个区间、education 一句话。

- code: ACCOUNTANT
  title_en: Accountant
  title_zh: 会计
  summary_en: "Accounting is the measurement, processing, and communication of financial information about economic entities."
  summary_zh: |
    会计是以货币为主要计量单位，运用专门方法，对特定单位的经济活动进行连续、系统、全面的核算与监督的一种经济管理活动。它的基本职能包括核算（反映经济活动情况）和监督（审查合法性、合理性），并参与经营决策。中文里“会计”一词至少可指会计工作、会计人员、会计部门或会计学科。从历史看，“会计”一词最早见于《周礼》，中国周代已设“司会”掌管财物赋税。
  responsibilities_en:
    - Recording, classifying, and summarizing financial transactions.
    - Interpreting results to provide useful information for managers, investors, creditors, and regulators.
    - Helping organizations measure performance and comply with legal and tax requirements.
    - Supporting informed decision-making.
  responsibilities_zh:
    - 核算与监督。
  required_skills_en:
    - "Professional/technical skills: accounting standards, financial statement preparation, tax filing, cost accounting and budgeting, basic financial analysis."
    - "Tool skills: Excel (functions, pivot tables), accounting software (UFIDA, Kingdee, SAP), ERP finance modules."
    - "Soft skills: attention to detail and accuracy, logical and organized thinking, communication, continuous learning, time management, ability to work under pressure."
    - "Professional conduct: integrity and confidentiality, compliance awareness, sense of responsibility."
  required_skills_zh:
    - "专业硬技能：熟悉会计准则与制度、财务报表编制、税务申报、成本核算与预算管理、基础财务分析。"
    - "工具技能：熟练使用Excel（函数、数据透视表）、财务软件（用友、金蝶、SAP等）及ERP财务模块。"
    - "软技能：细致准确、逻辑条理、沟通能力、持续学习能力、时间管理与抗压能力。"
    - "职业素养：诚信保密、合规意识、责任心。"
  experience_years: "2"
  education_en: "Bachelor's degree"
  education_zh: "学士学历"
  source: "自己写的"

- code: ADVOCATE
  title_en: Lawyer
  title_zh: 律师
  summary_en: "Provide legal advice, draft legal documents, and represent clients in litigation and arbitration."
  summary_zh: "为客户提供法律咨询、起草法律文书，并代理诉讼与仲裁。"
  responsibilities_en:
    - Advise clients on legal rights, obligations and risk.
    - Draft and review contracts, pleadings and other legal documents.
    - Represent clients in court hearings, arbitration and negotiations.
    - Conduct legal research and keep case files and deadlines in order.
  responsibilities_zh:
    - 就客户的法律权利、义务与风险提供咨询。
    - 起草并审核合同、诉状及其他法律文书。
    - 在庭审、仲裁与谈判中代理客户。
    - 开展法律检索，维护案卷与期限管理。
  required_skills_en:
    - "Legal knowledge: civil law, criminal law, procedural law and relevant regulations"
    - "Research tools: legal databases (Westlaw, LexisNexis), legal drafting"
    - "Soft skills: oral and written communication, negotiation, logical analysis, resilience"
    - "Professional conduct: confidentiality, professional ethics, conflict-of-interest awareness"
  required_skills_zh:
    - "法律知识：民法、刑法、诉讼法及相关法规"
    - "研究工具：法律数据库（Westlaw、LexisNexis）、法律文书起草"
    - "软技能：口头与书面表达、谈判、逻辑分析、抗压能力"
    - "职业素养：保密、职业道德、利益冲突识别"
  experience_years: "2-5"
  education_en: "Bachelor of Laws (LL.B.) and bar qualification"
  education_zh: "法学本科及以上，并取得律师执业资格"
  source: "AI 生成，待人工核实"

- code: AGRICULTURE
